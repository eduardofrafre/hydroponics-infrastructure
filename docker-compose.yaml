services:
  mqtt-broker:
    image: mochimqtt/server
    ports:
      - "1882:1882"
      - "1883:1883"
      - "1880:1880"
    # env_file:
    #   - .env
    volumes:
      - ./mqtt-broker/mqtt-broker-config.template.yaml:/config.yaml
      # - ./mqtt-broker/mqtt-broker.entrypoint.sh:/mqtt-broker.entrypoint.sh
    # entrypoint: ["sh", "/mqtt-broker.entrypoint.sh"]
    restart: unless-stopped
  mongodb:
    image: arm64v8/mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    # env_file:
    #   - .env
    volumes:
      - /mnt/sunder/hydroponics:/data/db
    restart: unless-stopped
